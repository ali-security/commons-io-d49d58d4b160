name: Java CI

on:
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [ 8, 11, 14 ]
        experimental: [false]
        include:
          - java: 15-ea
            os: ubuntu-latest
            experimental: true        
          - java: 15-ea
            os: windows-latest
            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v2.3.2
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false "-Drat.skip=true"
    - name: List skipped tests with reasons
      if: always()
      shell: bash
      run: |
        perl -0777 -ne 'while (/<testcase\b([^>]*)>\s*<skipped\b([^>]*)/g) { my ($a, $s) = ($1, $2); my ($n) = $a =~ /\bname="([^"]*)"/; my ($c) = $a =~ /classname="([^"]*)"/; my ($m) = $s =~ /message="([^"]*)"/; my $r = $m // "(no message)"; if ($r =~ /assumption is not true/) { (my $p = "src/test/java/$c.java") =~ s{\.(?=.*\.java$)}{/}g; if (open(my $fh, "<", $p)) { local $/; my $src = <$fh>; $r .= " [unmet condition in source: $1]" if $src =~ /void\s+\Q$n\E\s*\(.*?(assume(?:True|False)\([^;]*\));/s; } } print "SKIPPED TEST: $c#$n -- reason: $r\n" }' target/surefire-reports/TEST-*.xml
    - name: Upload Maven build artifacts
      if: success() && matrix.os == 'ubuntu-latest' && matrix.java == '8'
      uses: actions/upload-artifact@v4
      with:
        name: built-jars
        path: target/*.jar
        if-no-files-found: error
